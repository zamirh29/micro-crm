<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civil Legals - London Law Firm | English & Turkish</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            background: #f5f5f5;
            line-height: 1.6;
        }
        header {
            background: #1a1a1a;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 0.05em;
        }
        .language-switcher {
            display: flex;
            gap: 0.5rem;
        }
        .lang-btn {
            background: transparent;
            color: white;
            border: 2px solid white;
            padding: 0.4rem 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .lang-btn.active {
            background: white;
            color: #1a1a1a;
        }
        .lang-btn:hover {
            background: white;
            color: #1a1a1a;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        .flyer-section {
            margin-bottom: 3rem;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .flyer-header {
            background: #1a1a1a;
            color: white;
            padding: 1rem 1.5rem;
            font-size: 1.2rem;
            font-weight: 600;
        }
        .flyer-image {
            width: 100%;
            height: auto;
            display: block;
        }
        footer {
            background: #1a1a1a;
            color: white;
            text-align: center;
            padding: 2rem;
            margin-top: 3rem;
        }
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
            }
            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">CIVIL LEGALS</div>
        <div class="language-switcher">
            <button class="lang-btn active" onclick="showEnglish()">English</button>
            <button class="lang-btn" onclick="showTurkish()">Türkçe</button>
        </div>
    </header>

    <div class="container">
        <div id="english-section" class="flyer-section">
            <div class="flyer-header">English Version</div>
            <img src="public/civillegals-english.jpg" alt="Civil Legals - English Flyer" class="flyer-image">
        </div>

        <div id="turkish-section" class="flyer-section" style="display: none;">
            <div class="flyer-header">Turkish Version (Türkçe)</div>
            <img src="public/civillegals-turkish.jpg" alt="Civil Legals - Turkish Flyer" class="flyer-image">
        </div>
    </div>

    <footer>
        <p>&copy; <span id="year"></span> Civil Legals. London, United Kingdom.</p>
        <p style="margin-top: 0.5rem; opacity: 0.8;">Domain: civillegals.com</p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        
        function showEnglish() {
            document.getElementById('english-section').style.display = 'block';
            document.getElementById('turkish-section').style.display = 'none';
            document.querySelectorAll('.lang-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === 0);
            });
            document.documentElement.lang = 'en';
        }
        
        function showTurkish() {
            document.getElementById('english-section').style.display = 'none';
            document.getElementById('turkish-section').style.display = 'block';
            document.querySelectorAll('.lang-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === 1);
            });
            document.documentElement.lang = 'tr';
        }
    </script>
</body>
</html>
